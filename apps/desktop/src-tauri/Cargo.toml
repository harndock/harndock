[package]
name = "harndock-desktop"
version = "0.1.0"
description = "Tauri desktop host for DeepSeek Harness"
authors = ["Harndock contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harndock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
getrandom = "=0.4.3"
keyring = { version = "=4.1.6", default-features = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
tar = "=0.4.44"
zstd = "=0.13.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
