<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#111719" /><title>Mobile 插件中心 · harndock</title>
    <style>
      :root{color-scheme:dark;--bg:#0e1315;--panel:#151d20;--panel2:#1c272a;--ink:#eef3f0;--muted:#a5b2ac;--faint:#718078;--line:rgba(225,239,232,.12);--green:#91dfb2;--orange:#f0bb78;--blue:#8fc8ff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,#101719 0,#0d1214 55%);line-height:1.45}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--green);outline-offset:2px}[hidden]{display:none!important}.phone{width:min(100%,430px);min-height:100vh;margin:auto;border-right:1px solid var(--line);border-left:1px solid var(--line);background:#111719}.top{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 17px;border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:15px;letter-spacing:-.02em}.top p{margin:3px 0 0;color:var(--faint);font-size:9px}.avatar{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;color:#102019;background:var(--green);font-size:9px;font-weight:700}.screen{padding:21px 15px 83px}.eyebrow{margin-bottom:7px;color:var(--green);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.screen h2{margin:0 0 6px;font-size:25px;letter-spacing:-.05em}.subtitle{margin:0;color:var(--muted);font-size:11px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:18px 0}.summary-card{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.summary-card span{display:block;color:var(--faint);font-size:8px}.summary-card strong{display:block;margin-top:7px;font-size:17px}.summary-card small{color:var(--green);font-size:8px}.banner{display:flex;align-items:flex-start;gap:10px;padding:12px;margin:13px 0;border:1px solid #765f3d;border-radius:8px;color:var(--muted);background:#29231b;font-size:10px}.banner i{color:var(--orange);font-style:normal;font-size:14px}.banner strong{display:block;margin-bottom:3px;color:var(--orange);font-weight:600}.section-head{display:flex;align-items:center;justify-content:space-between;margin:21px 0 10px}.section-head h3{margin:0;font-size:13px}.section-head button{padding:0;border:0;color:var(--blue);background:transparent;font-size:9px}.plugin{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.plugin:last-child{border-bottom:0}.icon{width:38px;height:38px;display:grid;place-items:center;flex:none;border:1px solid rgba(145,223,178,.25);border-radius:8px;color:var(--green);background:#1b3025;font-size:16px}.icon.orange{color:var(--orange);background:#30271d}.copy{min-width:0;flex:1}.copy strong{display:block;overflow:hidden;font-size:11px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.copy span{display:block;margin-top:3px;color:var(--faint);font-size:8px}.state{color:var(--green);font-size:8px;white-space:nowrap}.state.warn{color:var(--orange)}.action{min-height:28px;padding:0 9px;border:1px solid #4c7e62;border-radius:5px;color:var(--green);background:#1b3025;font-size:9px}.action:hover{background:#244431}.detail{position:fixed;inset:0;z-index:3;overflow:auto;background:#111719}.detail-top{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line)}.back{width:29px;height:29px;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:transparent}.detail-top h2{margin:0;font-size:14px}.detail-body{padding:18px 15px 31px}.detail-body h3{margin:0 0 4px;font-size:18px}.detail-body .muted{margin:0;color:var(--faint);font-size:9px}.detail-section{padding:17px 0;border-bottom:1px solid var(--line)}.detail-section h4{margin:0 0 9px;color:var(--faint);font-size:9px;letter-spacing:.09em;text-transform:uppercase}.detail-section p{margin:0;color:var(--muted);font-size:10px;line-height:1.65}.permission{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:10px 0}.permission+.permission{border-top:1px solid var(--line)}.permission-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;background:var(--panel2);color:var(--muted);font-size:11px}.permission strong{display:block;font-size:10px;font-weight:550}.permission span{display:block;margin-top:2px;color:var(--faint);font-size:8px}.permission em{color:var(--orange);font-size:8px;font-style:normal}.cta{width:100%;min-height:39px;margin-top:18px;border:1px solid #4f8064;border-radius:7px;color:#102019;background:var(--green);font-size:10px;font-weight:650}.bottom{position:fixed;right:0;bottom:0;left:0;z-index:2;display:flex;justify-content:space-around;min-height:59px;padding:5px 6px;border-top:1px solid var(--line);background:rgba(20,27,30,.97)}.bottom button{min-width:68px;border:0;border-radius:6px;color:var(--faint);background:transparent;font-size:8px}.bottom button span{display:block;margin-bottom:2px;font-size:16px}.bottom button.active{color:var(--green);background:#1a3025}.login{display:grid;place-items:center;min-height:100vh;padding:24px 19px;background:#101719}.login-card{width:100%;padding:21px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel)}.login-card .mark{width:42px;height:42px;display:grid;place-items:center;margin-bottom:19px;border:1px solid #4c7d60;border-radius:10px;color:var(--green);background:#1b3025;font-size:22px}.login-card h2{margin:0 0 7px;font-size:21px}.login-card p{margin:0 0 21px;color:var(--muted);font-size:10px;line-height:1.6}.login-card button{width:100%;min-height:39px;margin-top:8px;border:1px solid var(--line-strong);border-radius:7px;color:var(--muted);background:transparent;font-size:10px}.login-card button.primary{border-color:#4f8064;color:#102019;background:var(--green);font-weight:650}.toast{position:fixed;right:15px;bottom:75px;left:15px;z-index:7;padding:11px;border:1px solid #4c6557;border-radius:7px;color:var(--ink);background:#1e3027;text-align:center;font-size:9px}@media(min-width:600px){.phone{min-height:760px;margin:22px auto;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden}.bottom{position:absolute;right:auto;left:50%;width:min(100%,430px);transform:translateX(-50%)}.toast{left:50%;width:330px;transform:translateX(-50%)}}
    </style>
  </head>
  <body><div class="phone"><header class="top"><div><h1>harndock</h1><p>插件资产</p></div><span class="avatar">LZ</span></header><main class="screen" id="screen"></main><nav class="bottom"><button class="active" data-view="home"><span>⌂</span>概览</button><button data-view="licenses"><span>◇</span>许可证</button><button data-view="tasks"><span>↻</span>任务</button><button data-view="settings"><span>⚙</span>设置</button></nav></div><div class="toast" id="toast" hidden></div>
    <script>
      const screen=document.querySelector('#screen'),toast=document.querySelector('#toast');let view='home';function toastMsg(t){toast.textContent=t;toast.hidden=false;setTimeout(()=>toast.hidden=true,2400)}function home(){screen.innerHTML=`<div class="eyebrow">Mobile companion</div><h2>插件资产</h2><p class="subtitle">查看许可证，审批发往本机的安装任务。</p><div class="summary"><div class="summary-card"><span>有效许可证</span><strong>4</strong><small>个人 3 · 组织 1</small></div><div class="summary-card"><span>设备激活</span><strong>2 / 3</strong><small>本机已连接</small></div></div><div class="banner"><i>!</i><div><strong>有 1 个安装任务待确认</strong><span>网页研究 Pro 请求安装到林舟的 MacBook Pro。</span></div></div><div class="section-head"><h3>最近活动</h3><button data-view="tasks">查看全部</button></div><div class="plugin"><span class="icon">⌁</span><div class="copy"><strong>网页研究 Pro</strong><span>等待本地权限确认 · v2.4.1</span></div><span class="state warn">待处理</span></div><div class="plugin"><span class="icon">⌘</span><div class="copy"><strong>代码审查员</strong><span>新版本可用 · v3.2.0</span></div><span class="state">可更新</span></div><div class="section-head"><h3>已安装插件</h3><button data-view="licenses">管理</button></div><div class="plugin"><span class="icon">◈</span><div class="copy"><strong>项目记忆库</strong><span>运行中 · 组织提供</span></div><span class="state">正常</span></div><div class="plugin"><span class="icon orange">↗</span><div class="copy"><strong>工作流 Studio</strong><span>运行中 · 组织提供</span></div><span class="state">正常</span></div>`}function licenses(){screen.innerHTML=`<div class="eyebrow">Entitlements</div><h2>许可证</h2><p class="subtitle">本机和组织分配的权益状态。</p><div class="section-head"><h3>我的权益</h3><button data-toast="许可证已同步">↻ 同步</button></div><div class="plugin"><span class="icon">⌘</span><div class="copy"><strong>代码审查员</strong><span>永久许可证 · 设备 2 / 3</span></div><span class="state">有效</span></div><div class="plugin"><span class="icon orange">◫</span><div class="copy"><strong>SQL 探索器</strong><span>试用中 · 剩余 8 天</span></div><span class="state warn">试用</span></div><div class="plugin"><span class="icon">↗</span><div class="copy"><strong>工作流 Studio</strong><span>星河研发 · 席位 1 / 12</span></div><span class="state">组织</span></div><div class="section-head"><h3>已激活设备</h3><button data-toast="设备管理在 Gateway 中完成">管理</button></div><div class="plugin"><span class="avatar">⌘</span><div class="copy"><strong>林舟的 MacBook Pro</strong><span>macOS · 当前设备 · 刚刚在线</span></div><span class="state">在线</span></div><div class="plugin"><span class="avatar" style="background:var(--blue)">⌘</span><div class="copy"><strong>林舟的 Mac mini</strong><span>macOS · 昨天在线</span></div><span class="state">在线</span></div>`}function tasks(){screen.innerHTML=`<div class="eyebrow">Remote install</div><h2>安装任务</h2><p class="subtitle">来自 Gateway 的安装请求，需要你确认本地权限。</p><div class="detail-section"><h4>待确认</h4><div class="plugin"><span class="icon">⌁</span><div class="copy"><strong>网页研究 Pro</strong><span>v2.4.1 · harndock Labs</span></div><span class="state warn">待处理</span></div><p>目标设备：林舟的 MacBook Pro<br />发起人：林舟 · 星河研发<br />Gateway 已检查许可证和组织策略。</p><button class="cta" data-approve>查看权限并允许</button></div><div class="detail-section"><h4>最近任务</h4><div class="plugin"><span class="icon">⌘</span><div class="copy"><strong>代码审查员</strong><span>v3.2.0 · 4 台设备</span></div><span class="state">3 / 4 完成</span></div><div class="plugin"><span class="icon">◈</span><div class="copy"><strong>项目记忆库</strong><span>v1.2.8 · 7 台设备</span></div><span class="state">已完成</span></div></div>`}function settings(){screen.innerHTML=`<div class="eyebrow">Settings</div><h2>设置</h2><p class="subtitle">账号、设备和本地安装偏好。</p><div class="section-head"><h3>harndock Account</h3></div><div class="plugin"><span class="avatar">LZ</span><div class="copy"><strong>林舟</strong><span>linzhou@example.com · 个人 Pro</span></div><button class="action" data-toast="账号页面将在浏览器中打开">管理</button></div><div class="section-head"><h3>本地 Harness</h3></div><div class="plugin"><span class="icon">◇</span><div class="copy"><strong>Desktop Runtime</strong><span>0.1.2-alpha.1 · 已连接</span></div><span class="state">在线</span></div><div class="plugin"><span class="icon">⚙</span><div class="copy"><strong>安装前确认权限</strong><span>新增权限时始终询问</span></div><button class="action" data-toggle>开启</button></div><div class="section-head"><h3>数据边界</h3></div><p class="subtitle">Marketplace 和 Mobile 不会读取项目文件、Session 内容、prompt 或工具输出。</p><button class="cta" data-toast="已退出 harndock Account，本地免费插件仍可使用">退出市场账号</button>`}function render(){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));({home,licenses,tasks,settings}[view]||home)()}document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render()}if(e.target.closest('[data-toast]'))toastMsg(e.target.closest('[data-toast]').dataset.toast);if(e.target.closest('[data-approve]')){view='licenses';render();toastMsg('已允许本地安装权限，Desktop 将开始安装')}});render();
    </script>
  </body>
</html>
