      const plugin={id:'dsh-at-file',name:'@file 工作区引用',author:'javajeans',category:'开发者工具',summary:'在 Harness Web 输入框中使用 @ 快速引用工作区文件和目录。',description:'支持文件与目录搜索、路径引用和工作区过滤，作为 Host + Web Client 插件加载。',icon:'@',status:'published',updated:'2026-09-04 14:04'};
      const releases=[{version:'0.7.3',status:'review',tag:'v0.7.3',commit:'待锁定',asset:'dsh-at-file-0.7.3.tar.zst',size:'238 KB',sha:'待校验',created:'2026-09-05 10:12'},{version:'0.7.2',status:'published',tag:'v0.7.2',commit:'56642e4c8560517ab9ff09c00cf7a44f62b6a4d9',asset:'dsh-at-file-0.7.2.tar.zst',size:'237,918 B',sha:'46c273f152259e90614220314cb8df69ef9fbc911d99f36bccae51faeb831e01',created:'2026-09-04 14:04'},{version:'0.7.1',status:'unpublished',tag:'v0.7.1',commit:'94a25392795f5d992d7fcd55f15aaf15cd03ee7d',asset:'dsh-at-file-0.7.1.tar.zst',size:'238,745 B',sha:'da7ddb5707f1147468deb6848ba0772c78c04ce51448c701ad90266ab1c4ff9a',created:'2026-09-03 16:14'}];

      const app=document.querySelector('#app'),modal=document.querySelector('#create-modal'),toast=document.querySelector('#toast');

      const release=version=>releases.find(item=>item.version===version)||releases[0];
      function head(eyebrow,title,copy,action=''){return `<div class="view-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${copy}</p></div>${action}</div>`}
      function overview(){app.innerHTML=head('Content operations','内容管理','维护插件条目、GitHub Release、Manifest 和发布状态。','<button class="button primary" data-create>＋ 新建插件</button>')+`<div class="notice"><span><strong>有 1 个版本等待审核</strong>　dsh-at-file v0.7.3 已完成 GitHub Release 登记，等待内容审核。</span><button class="button small" data-view="review">前往审核</button></div><div class="stats"><div class="stat"><small>插件条目</small><strong>1</strong><em>已接入 Center Catalog</em></div><div class="stat"><small>已发布插件</small><strong>1</strong><em>Marketplace 可见</em></div><div class="stat"><small>待审核版本</small><strong>1</strong><em style="color:var(--orange)">需要处理</em></div><div class="stat"><small>来源异常</small><strong>0</strong><em class="neutral">最近一次巡检正常</em></div></div><div class="two-column"><section class="panel"><div class="panel-head"><div><h2>插件条目</h2><p>当前 Catalog 中的内容记录</p></div><button class="button small" data-view="plugins">查看全部</button></div><div class="table"><div class="table-row header"><span>插件</span><span>分类</span><span>状态</span><span class="right">更新时间</span></div><div class="table-row"><span><strong>${plugin.name}</strong><small>${plugin.id} · ${plugin.author}</small></span><span>${plugin.category}</span><span>${badge(plugin.status)}</span><span class="right">${plugin.updated}</span></div></div></section><section class="panel"><div class="panel-head"><div><h2>最近发布活动</h2><p>可追溯的内容变更</p></div><button class="button small" data-view="history">发布记录</button></div><div class="activity"><div class="activity-item"><i></i><div><strong>v0.7.2 已发布</strong><span>javajeans · GitHub Release</span></div><time>昨天</time></div><div class="activity-item"><i style="background:#e2a04d"></i><div><strong>v0.7.3 提交审核</strong><span>签名和来源待复核</span></div><time>今天</time></div><div class="activity-item"><i style="background:#9daab6"></i><div><strong>插件条目已更新</strong><span>简介和来源信息</span></div><time>今天</time></div></div></section></div>`}
      function plugins(){app.innerHTML=head('Catalog','插件条目','管理插件公开信息、分类和版本关系。','<button class="button primary" data-create>＋ 新建插件</button>')+`<div class="detail-layout"><section class="panel list-panel"><div class="toolbar"><label class="search"><span>⌕</span><input id="plugin-search" placeholder="搜索插件、作者或 Plugin ID" /></label><span style="color:var(--faint);font-size:9px">1 个条目</span></div><button class="plugin-item selected" data-select-plugin><span class="plugin-copy"><span class="plugin-icon">${plugin.icon}</span><span><strong>${plugin.name}</strong><small>${plugin.id} · ${plugin.author}</small></span></span><span class="meta">${badge(plugin.status)}<small>3 个版本</small></span></button></section><section class="panel detail-panel"><div class="detail-title"><span class="plugin-icon">${plugin.icon}</span><div><h2>${plugin.name}</h2><p>${plugin.id} · ${plugin.author} · ${plugin.category}</p></div><span style="margin-left:auto">${badge(plugin.status)}</span></div><div class="detail-section"><h3>公开内容</h3><p>${plugin.description}</p></div><div class="detail-section"><h3>目录字段</h3><div class="kv-grid"><div class="kv"><span>Slug</span><strong>dsh-at-file</strong></div><div class="kv"><span>Marketplace 状态</span><strong style="color:var(--green)">已发布</strong></div><div class="kv"><span>最新已发布版本</span><strong>0.7.2</strong></div><div class="kv"><span>来源仓库</span><strong>javajeans/dsh-at-file</strong></div></div></div><div class="detail-section"><h3>版本列表</h3>${releases.map(item=>`<div class="release-line"><div><strong>v${item.version}</strong><small>${item.tag} · ${item.asset}</small></div><div class="release-actions">${badge(item.status)}<button class="button small" data-view="${item.status==='review'?'review':'artifacts'}">查看</button></div></div>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:7px"><button class="button" data-toast="编辑表单将在正式管理端打开">编辑条目</button><button class="button primary" data-view="review">处理待审核版本</button></div></section></div>`}
      function review(){const item=release(selectedVersion);app.innerHTML=head('Release review','版本审核','审核 Manifest、GitHub 来源、权限和兼容性后再发布。','<button class="button" data-view="plugins">返回插件条目</button>')+`<div class="detail-layout"><section class="panel list-panel"><div class="panel-head"><div><h2>待审核队列</h2><p>仅展示 draft 或 review 状态的版本</p></div><span class="badge review">1 个待处理</span></div><div class="review-card selected"><div class="review-card-head"><div><h3>${plugin.name} · v0.7.3</h3><p>提交于 2026-09-05 10:12 · javajeans</p></div>${badge(item.status)}</div><div class="review-meta"><div><span>GitHub Release</span><strong>v0.7.3</strong></div><div><span>插件类型</span><strong>Host + Client</strong></div><div><span>平台</span><strong>darwin-arm64</strong></div></div><div class="review-actions"><button class="button small" data-view="artifacts">查看校验</button><button class="button small warn" data-review-action="reject">退回修改</button><button class="button small primary" data-review-action="publish">通过并发布</button></div></div></section><section class="panel detail-panel"><div class="panel-head"><div><h2>审核详情</h2><p>发布前必须完成所有检查</p></div>${badge(item.status)}</div><div class="detail-section" style="padding-top:0"><h3>Manifest</h3><div class="kv-grid"><div class="kv"><span>Plugin ID</span><strong>dsh-at-file</strong></div><div class="kv"><span>版本</span><strong>0.7.3</strong></div><div class="kv"><span>Runtime API</span><strong>1 · 兼容</strong></div><div class="kv"><span>最低 Harness</span><strong>0.1.0 · 兼容</strong></div></div></div><div class="detail-section"><h3>权限请求</h3><div class="release-line"><div><strong>读取工作区文件</strong><small>filesystem.workspace</small></div><span class="badge review">需要确认</span></div><div class="release-line"><div><strong>网络访问</strong><small>Manifest 未请求</small></div><span class="badge published">不需要</span></div><div class="release-line"><div><strong>执行命令</strong><small>Manifest 未请求</small></div><span class="badge published">不需要</span></div></div><div class="detail-section"><h3>审核结论</h3><p style="color:var(--green)">✓ Manifest Schema 通过　✓ 签名 Key 已信任　✓ GitHub 来源已绑定　✓ 平台和 Runtime 兼容</p></div><div style="display:flex;justify-content:flex-end;gap:7px"><button class="button warn" data-review-action="reject">退回修改</button><button class="button primary" data-review-action="publish">通过并发布</button></div></section></div>`}
      function artifacts(){app.innerHTML=head('Supply chain','工件与签名','查看 GitHub Release、Manifest Asset、摘要和签名校验结果。','<button class="button primary" data-toast="正在请求 GitHub Provider 重新校验">重新校验来源</button>')+`<div class="notice"><span><strong>GitHub 来源状态正常</strong>　仓库、Tag、commit SHA、Asset 和 Manifest Asset 均来自 Center 登记声明。</span><span class="badge published">已校验</span></div><section class="panel artifact-table"><div class="panel-head"><div><h2>${plugin.name}</h2><p>${plugin.id} · 公开仓库 javajeans/dsh-at-file</p></div>${badge('published')}</div><div class="table"><div class="table-row header"><span>版本</span><span>GitHub 来源</span><span>Asset</span><span>完整性</span><span>签名</span></div>${releases.map(item=>`<div class="table-row"><span><strong>v${item.version}</strong><small>${labels[item.status]}</small></span><span class="source">${item.tag}<br />${item.commit}</span><span><strong>${item.asset}</strong><small>${item.size}</small></span><span>${item.sha==='待校验'?'<span class="badge review">待校验</span>':'<span class="badge published">SHA-256 匹配</span>'}</span><span>${item.sha==='待校验'?'<span class="badge review">待复核</span>':'<span class="badge published">Ed25519 有效</span>'}</span></div>`).join('')}</div></section><section class="two-column" style="margin-top:15px"><section class="panel"><div class="panel-head"><div><h2>来源合同</h2><p>GitHub Provider 读取的固定字段</p></div></div><div class="kv-grid"><div class="kv"><span>Repository</span><strong>javajeans/dsh-at-file</strong></div><div class="kv"><span>Provider</span><strong>github</strong></div><div class="kv"><span>Manifest Asset</span><strong>plugin-manifest.json</strong></div><div class="kv"><span>下载策略</span><strong>Desktop 直连 GitHub</strong></div></div></section><section class="panel"><div class="panel-head"><div><h2>信任根</h2><p>Center 与 Desktop 使用同一公钥映射</p></div></div><div class="kv"><span>Key ID</span><strong>marketplace-dev-rfc8032</strong></div><div class="kv" style="margin-top:8px"><span>状态</span><strong style="color:var(--green)">已配置 · 不暴露私钥</strong></div></section></section>`}
      function history(){app.innerHTML=head('Release history','发布记录','追踪插件版本从登记、审核到发布或下架的完整过程。','<button class="button" data-toast="正式版本支持按时间、插件和操作者导出审计">导出记录</button>')+`<section class="panel"><div class="toolbar"><label class="search"><span>⌕</span><input placeholder="搜索插件、版本或操作者" /></label><div class="filters"><button class="filter active">全部动作</button><button class="filter">发布</button><button class="filter">下架</button><button class="filter">审核</button></div></div><div class="timeline"><div class="event"><time>2026-09-05<br />10:12</time><div class="event-line"><i></i></div><div class="event-copy"><strong>plugin.release.submitted · v0.7.3</strong><p>dsh-at-file · javajeans 提交版本审核，来源为 GitHub Release v0.7.3。</p></div></div><div class="event"><time>2026-09-04<br />14:04</time><div class="event-line"><i></i></div><div class="event-copy"><strong>plugin.release.published · v0.7.2</strong><p>dsh-at-file · local-admin 发布版本，Marketplace 和 Desktop 已可见。</p></div></div><div class="event"><time>2026-09-04<br />14:03</time><div class="event-line"><i></i></div><div class="event-copy"><strong>plugin.release.reviewed · v0.7.2</strong><p>Manifest、SHA-256、签名、平台和 GitHub commit SHA 校验通过。</p></div></div><div class="event"><time>2026-09-03<br />16:14</time><div class="event-line"><i></i></div><div class="event-copy"><strong>plugin.release.unpublished · v0.7.1</strong><p>dsh-at-file · local-admin 下架旧版本，已安装用户不受影响。</p></div></div><div class="event"><time>2026-09-03<br />16:10</time><div class="event-line"><i></i></div><div class="event-copy"><strong>plugin.created · dsh-at-file</strong><p>插件条目创建，目录信息进入草稿状态。</p></div></div></div></section>`}
      function render(){document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===active));({overview,plugins,review,artifacts,history}[active]||overview)()}
      function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
      document.addEventListener('click',event=>{const view=event.target.closest('[data-view]');if(view){active=view.dataset.view;render();return}if(event.target.closest('[data-create]')){modal.hidden=false;return}if(event.target.closest('[data-close]')){modal.hidden=true;return}const action=event.target.closest('[data-review-action]');if(action){if(action.dataset.reviewAction==='publish'){release('0.7.3').status='published';showToast('v0.7.3 已发布，Marketplace 将展示新版本')}else showToast('版本已退回修改');render();return}const toastTarget=event.target.closest('[data-toast]');if(toastTarget)showToast(toastTarget.dataset.toast)});
      document.querySelector('#create-form').addEventListener('submit',event=>{event.preventDefault();modal.hidden=true;showToast('插件草稿已创建，可继续登记 GitHub Release')});
      render();
    </script>
  </body>
