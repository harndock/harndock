<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101618" />
    <meta name="description" content="harndock 插件中心完整商业化交互原型" />
    <title>插件中心 · harndock</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1214;
        --top: #101618;
        --panel: #141b1e;
        --panel-2: #192225;
        --panel-3: #202b2e;
        --ink: #eef3f0;
        --muted: #a8b4af;
        --faint: #74817c;
        --line: rgba(225, 239, 232, .11);
        --line-strong: rgba(225, 239, 232, .2);
        --green: #91dfb2;
        --green-dark: #1b3327;
        --blue: #8fc8ff;
        --orange: #f0bb78;
        --red: #ed8d87;
        --purple: #c0acff;
        --shadow: rgba(0, 0, 0, .42);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; color: var(--ink); background: var(--bg); line-height: 1.45; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
      [hidden] { display: none !important; }
      h1, h2, h3, h4, p { margin-top: 0; }
      .app { min-height: 100vh; display: grid; grid-template-rows: 62px minmax(0, 1fr); }

      .topbar { display: flex; align-items: center; gap: 20px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--top); }
      .brand { min-width: 206px; display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
      .brand-mark { width: 29px; height: 29px; display: grid; place-items: center; border: 1px solid #4c7d60; border-radius: 7px; color: var(--green); background: #1b3025; font-size: 16px; }
      .brand strong { display: block; font-size: 13px; font-weight: 650; }
      .brand small { display: block; color: var(--faint); font-size: 9px; font-weight: 400; }
      .global-search { width: min(430px, 38vw); display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--faint); background: #151d1f; }
      .global-search input { width: 100%; min-height: 34px; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
      .global-search input::placeholder { color: var(--faint); }
      .key { font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
      .top-spacer { flex: 1; }
      .runtime-state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; white-space: nowrap; }
      .dot { width: 6px; height: 6px; display: inline-block; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(145, 223, 178, .1); }
      .dot.orange { background: var(--orange); box-shadow: none; }
      .dot.red { background: var(--red); box-shadow: none; }
      .account-button, .login-button { min-height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; color: var(--muted); background: transparent; font-size: 10px; }
      .account-button:hover, .login-button:hover { color: var(--ink); background: var(--panel-2); }
      .avatar { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: #102019; background: var(--green); font-size: 9px; font-weight: 700; }
      .account-wrap { position: relative; }
      .account-menu { position: absolute; top: 42px; right: 0; z-index: 10; width: 210px; padding: 7px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); box-shadow: 0 18px 44px var(--shadow); }
      .account-menu-head { padding: 9px 10px 11px; border-bottom: 1px solid var(--line); }
      .account-menu-head strong { display: block; font-size: 11px; }
      .account-menu-head span { display: block; margin-top: 2px; color: var(--faint); font-size: 9px; }
      .menu-action { width: 100%; padding: 9px 10px; border: 0; border-radius: 5px; color: var(--muted); background: transparent; font-size: 10px; text-align: left; }
      .menu-action:hover { color: var(--ink); background: var(--panel-2); }

      .workspace { min-height: 0; display: grid; grid-template-columns: 218px minmax(580px, 1fr) 330px; }
      .sidebar { display: flex; flex-direction: column; padding: 16px 11px; border-right: 1px solid var(--line); background: var(--panel); }
      .nav-label { margin: 9px 11px 7px; color: var(--faint); font-size: 9px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
      .nav-group { display: grid; gap: 2px; margin-bottom: 18px; }
      .nav-item { width: 100%; min-height: 36px; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; color: var(--muted); background: transparent; font-size: 11px; text-align: left; }
      .nav-item:hover { background: var(--panel-2); }
      .nav-item.active { border-color: #385c49; color: var(--ink); background: #1d3026; }
      .nav-icon { color: var(--faint); font-size: 13px; text-align: center; }
      .nav-item.active .nav-icon { color: var(--green); }
      .nav-badge { color: var(--faint); font-size: 9px; }
      .nav-badge.warn { color: var(--orange); }
      .local-status { margin-top: auto; padding: 12px; border: 1px solid #375a47; border-radius: 7px; background: #17251e; }
      .local-status-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 10px; }
      .local-status-head span { color: var(--green); }
      .local-row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; color: var(--faint); font-size: 9px; }
      .local-row strong { color: var(--muted); font-weight: 500; }

      .content { min-width: 0; overflow: auto; padding: 27px clamp(22px, 3vw, 44px) 46px; background: #111719; }
      .content-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
      .eyebrow { margin-bottom: 6px; color: var(--green); font-size: 9px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
      .content-head h1 { margin-bottom: 5px; font-size: 26px; letter-spacing: -.04em; }
      .content-head p { margin: 0; color: var(--muted); font-size: 11px; }
      .head-actions { display: flex; align-items: flex-start; gap: 7px; }
      .button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--muted); background: transparent; font-size: 10px; white-space: nowrap; }
      .button:hover { color: var(--ink); background: var(--panel-2); }
      .button.primary { border-color: #508066; color: #102019; background: var(--green); font-weight: 650; }
      .button.primary:hover { background: #a6edc4; }
      .button.danger { border-color: #704743; color: var(--red); background: #2c1e1e; }
      .button.block { width: 100%; }
      .button:disabled { cursor: default; opacity: .55; }

      .guest-strip, .notice { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 10px 12px; margin-bottom: 16px; border: 1px solid #4b5e54; border-radius: 7px; color: var(--muted); background: #18231f; font-size: 10px; }
      .guest-strip strong, .notice strong { color: var(--ink); font-weight: 600; }
      .notice.warn { border-color: #6d593d; background: #29231b; }
      .notice.warn strong { color: var(--orange); }
      .hero { min-height: 176px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; padding: 22px; margin-bottom: 22px; overflow: hidden; border: 1px solid #3b654f; border-radius: 9px; background: linear-gradient(115deg, #1c3126, #172725 55%, #17242a); }
      .hero-copy { align-self: center; }
      .hero h2 { max-width: 440px; margin-bottom: 7px; font-size: 21px; letter-spacing: -.04em; }
      .hero p { max-width: 430px; margin-bottom: 15px; color: #bdcbc3; font-size: 11px; }
      .hero-visual { align-self: center; display: grid; gap: 7px; padding-left: 20px; border-left: 1px solid rgba(145, 223, 178, .15); }
      .hero-line { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 9px; border: 1px solid rgba(225, 239, 232, .1); border-radius: 6px; background: rgba(9, 16, 14, .26); font-size: 9px; }
      .hero-line i { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--green); background: #21372b; font-style: normal; }
      .hero-line span { color: var(--muted); }
      .hero-line b { color: var(--green); font-size: 8px; font-weight: 550; }

      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
      .segments { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: #151d1f; }
      .segment { min-height: 28px; padding: 0 10px; border: 0; border-radius: 5px; color: var(--faint); background: transparent; font-size: 9px; }
      .segment.active { color: var(--ink); background: var(--panel-3); }
      .select { min-height: 31px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: var(--panel); font-size: 9px; }
      .filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 17px; }
      .filter { min-height: 26px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: transparent; font-size: 9px; }
      .filter.active, .filter:hover { border-color: #4e7d62; color: var(--green); background: #1a3025; }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
      .section-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
      .section-head span { color: var(--faint); font-size: 9px; }
      .plugin-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .plugin-card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); transition: border-color .18s ease, transform .18s ease; }
      .plugin-card:hover, .plugin-card.selected { border-color: #466c57; transform: translateY(-1px); }
      .plugin-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
      .plugin-icon { width: 37px; height: 37px; display: grid; place-items: center; flex: none; border: 1px solid rgba(145, 223, 178, .25); border-radius: 8px; color: var(--green); background: #1b3025; font-size: 17px; font-weight: 700; }
      .plugin-icon.blue { color: var(--blue); background: #1b2935; border-color: rgba(143, 200, 255, .25); }
      .plugin-icon.orange { color: var(--orange); background: #32281d; border-color: rgba(240, 187, 120, .25); }
      .plugin-icon.purple { color: var(--purple); background: #292337; border-color: rgba(192, 172, 255, .25); }
      .price { color: var(--ink); font-size: 11px; font-weight: 650; white-space: nowrap; }
      .price small { display: block; color: var(--faint); font-size: 8px; font-weight: 400; text-align: right; }
      .plugin-name { width: 100%; padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
      .plugin-name h3 { overflow: hidden; margin-bottom: 3px; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .author { display: block; color: var(--faint); font-size: 9px; }
      .plugin-card p { display: -webkit-box; overflow: hidden; min-height: 32px; margin: 9px 0 12px; color: var(--muted); font-size: 10px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .tag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
      .tag { padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--faint); font-size: 8px; }
      .plugin-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .rating { color: var(--faint); font-size: 8px; }
      .rating b { color: var(--orange); font-weight: 500; }
      .card-action { min-height: 28px; padding: 0 9px; border: 1px solid #4c7e62; border-radius: 5px; color: var(--green); background: #1b3025; font-size: 9px; }
      .card-action:hover { background: #244431; }
      .card-action.owned { border-color: var(--line); color: var(--muted); background: transparent; }
      .card-action.update { border-color: #765f3e; color: var(--orange); background: #2c251c; }

      .detail { min-width: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--panel); }
      .detail-head { min-height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 19px; border-bottom: 1px solid var(--line); }
      .detail-head h2 { margin: 0; font-size: 13px; }
      .detail-body { padding: 20px 19px 28px; }
      .detail-title { display: flex; gap: 11px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
      .detail-title .plugin-icon { width: 44px; height: 44px; }
      .detail-title h3 { margin: 1px 0 3px; font-size: 16px; }
      .detail-title p { margin: 0; color: var(--faint); font-size: 9px; }
      .detail-section { padding: 16px 0; border-bottom: 1px solid var(--line); }
      .detail-section h4 { margin: 0 0 9px; color: var(--faint); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
      .detail-copy { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.65; }
      .kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; color: var(--muted); font-size: 9px; }
      .kv strong { color: var(--ink); font-weight: 500; text-align: right; }
      .kv strong.good { color: var(--green); }
      .kv strong.warn { color: var(--orange); }
      .permission-row { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; padding: 8px 0; }
      .permission-row + .permission-row { border-top: 1px solid var(--line); }
      .permission-icon { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); background: var(--panel-2); font-size: 11px; }
      .permission-row strong { display: block; font-size: 10px; font-weight: 550; }
      .permission-row span { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
      .permission-row em { color: var(--orange); font-size: 8px; font-style: normal; }
      .detail-actions { display: grid; gap: 7px; padding-top: 16px; }
      .mini-note { margin: 9px 0 0; color: var(--faint); font-size: 8px; line-height: 1.55; text-align: center; }
      .close-detail { display: none; }

      .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 19px; }
      .metric { padding: 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
      .metric span { display: block; margin-bottom: 10px; color: var(--faint); font-size: 9px; }
      .metric strong { display: block; font-size: 19px; font-weight: 650; letter-spacing: -.03em; }
      .metric small { color: var(--green); font-size: 8px; }
      .data-section { margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
      .data-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); }
      .data-head h2 { margin: 0; font-size: 12px; }
      .data-head p { margin: 2px 0 0; color: var(--faint); font-size: 8px; }
      .table { width: 100%; border-collapse: collapse; }
      .table th { padding: 9px 12px; color: var(--faint); font-size: 8px; font-weight: 550; text-align: left; }
      .table td { padding: 11px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 9px; vertical-align: middle; }
      .table td strong { display: block; color: var(--ink); font-size: 10px; font-weight: 550; }
      .table td small { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
      .status { display: inline-flex; align-items: center; gap: 5px; min-height: 21px; padding: 0 6px; border: 1px solid #42664f; border-radius: 999px; color: var(--green); font-size: 8px; white-space: nowrap; }
      .status.warn { border-color: #755f3d; color: var(--orange); }
      .status.muted { border-color: var(--line); color: var(--faint); }
      .row-action { padding: 0; border: 0; color: var(--blue); background: transparent; font-size: 9px; }
      .row-action:hover { text-decoration: underline; }
      .split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(230px, .8fr); gap: 12px; }
      .settings-list { padding: 0 14px; }
      .setting-row { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-bottom: 1px solid var(--line); }
      .setting-row:last-child { border-bottom: 0; }
      .setting-row strong { display: block; font-size: 10px; font-weight: 550; }
      .setting-row span { display: block; margin-top: 3px; color: var(--faint); font-size: 8px; }
      .toggle { width: 34px; height: 19px; padding: 2px; border: 0; border-radius: 999px; background: #2c3835; }
      .toggle::before { width: 15px; height: 15px; display: block; border-radius: 50%; background: var(--faint); content: ""; transition: transform .18s ease; }
      .toggle.on { background: #356a4e; }
      .toggle.on::before { background: var(--green); transform: translateX(15px); }
      .activity-list { padding: 0 14px; }
      .activity { display: grid; grid-template-columns: 7px 1fr auto; align-items: start; gap: 9px; padding: 11px 0; border-bottom: 1px solid var(--line); }
      .activity:last-child { border-bottom: 0; }
      .activity i { width: 7px; height: 7px; margin-top: 3px; border-radius: 50%; background: var(--green); }
      .activity strong { display: block; font-size: 9px; font-weight: 550; }
      .activity span { display: block; margin-top: 3px; color: var(--faint); font-size: 8px; }
      .activity time { color: var(--faint); font-size: 8px; }

      .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(5, 8, 9, .76); }
      .modal-card { width: min(510px, 100%); max-height: calc(100vh - 36px); overflow: auto; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel); box-shadow: 0 24px 70px var(--shadow); }
      .modal-card.wide { width: min(680px, 100%); }
      .modal-head { display: flex; justify-content: space-between; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
      .modal-head h2 { margin: 0; font-size: 15px; }
      .modal-head p { margin: 4px 0 0; color: var(--faint); font-size: 9px; }
      .icon-button { width: 31px; height: 31px; display: grid; place-items: center; flex: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: transparent; font-size: 15px; }
      .icon-button:hover { color: var(--ink); background: var(--panel-2); }
      .modal-body { display: grid; gap: 15px; padding: 19px 20px 20px; }
      .auth-brand { display: flex; align-items: center; gap: 10px; }
      .auth-brand .brand-mark { width: 38px; height: 38px; }
      .auth-brand h3 { margin: 0 0 3px; font-size: 14px; }
      .auth-brand p { margin: 0; color: var(--faint); font-size: 9px; }
      .field { display: grid; gap: 5px; color: var(--muted); font-size: 9px; }
      .field input { width: 100%; min-height: 37px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #111719; font-size: 10px; }
      .field .select { width: 100%; min-height: 37px; }
      .divider { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 8px; }
      .divider::before, .divider::after { height: 1px; flex: 1; background: var(--line); content: ""; }
      .auth-note { margin: 0; color: var(--faint); font-size: 8px; line-height: 1.55; text-align: center; }
      .scope-list { border: 1px solid var(--line); border-radius: 7px; }
      .scope { display: grid; grid-template-columns: 25px 1fr; gap: 9px; padding: 10px; }
      .scope + .scope { border-top: 1px solid var(--line); }
      .scope i { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 5px; color: var(--green); background: var(--green-dark); font-style: normal; }
      .scope strong { display: block; font-size: 10px; font-weight: 550; }
      .scope span { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 7px; }
      .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .plan { padding: 12px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: transparent; text-align: left; }
      .plan.selected { border-color: #4d8063; background: #192d23; }
      .plan strong { display: block; color: var(--ink); font-size: 11px; }
      .plan span { display: block; margin-top: 3px; color: var(--faint); font-size: 8px; }
      .plan b { display: block; margin-top: 12px; color: var(--green); font-size: 14px; }
      .order-box { padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: #111719; }
      .order-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; color: var(--muted); font-size: 9px; }
      .order-row.total { padding-top: 9px; margin-top: 5px; border-top: 1px solid var(--line); color: var(--ink); font-size: 11px; font-weight: 650; }
      .payment-method { display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid #496354; border-radius: 7px; background: #17231e; }
      .payment-logo { width: 35px; height: 23px; display: grid; place-items: center; border-radius: 4px; color: var(--ink); background: #26334a; font-size: 8px; font-weight: 700; }
      .payment-method strong { display: block; font-size: 9px; }
      .payment-method span { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
      .payment-method button { margin-left: auto; border: 0; color: var(--blue); background: transparent; font-size: 8px; }
      .success { padding: 14px 0; text-align: center; }
      .success-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 13px; border: 1px solid #4f8566; border-radius: 50%; color: var(--green); background: #1b3025; font-size: 22px; }
      .success h3 { margin-bottom: 6px; font-size: 16px; }
      .success p { max-width: 360px; margin: 0 auto; color: var(--muted); font-size: 9px; line-height: 1.6; }
      .progress { display: grid; gap: 7px; }
      .progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; }
      .progress-track { height: 6px; overflow: hidden; border-radius: 999px; background: #27312f; }
      .progress-bar { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .22s ease; }
      .toast { position: fixed; right: 18px; bottom: 18px; z-index: 30; max-width: 330px; padding: 10px 13px; border: 1px solid #4c6556; border-radius: 6px; color: var(--ink); background: #1e3027; box-shadow: 0 14px 34px var(--shadow); opacity: 0; pointer-events: none; transform: translateY(8px); transition: .18s ease; font-size: 10px; }
      .toast.visible { opacity: 1; transform: none; }
      .mobile-nav { display: none; }

      @media (max-width: 1130px) {
        .workspace { grid-template-columns: 202px minmax(0, 1fr); }
        .detail { display: none; }
        .detail.mobile-open { position: fixed; inset: 0; z-index: 15; display: block; }
        .detail.mobile-open .close-detail { display: grid; }
      }
      @media (max-width: 760px) {
        .app { grid-template-rows: 57px minmax(0, 1fr); }
        .topbar { gap: 10px; padding: 0 13px; }
        .brand { min-width: auto; }
        .brand strong, .brand small, .runtime-state, .key { display: none; }
        .global-search { width: auto; flex: 1; }
        .account-button > span:not(.avatar) { display: none; }
        .workspace { display: block; }
        .sidebar { display: none; }
        .content { min-height: calc(100vh - 57px); padding: 20px 15px 76px; }
        .content-head { display: block; }
        .content-head h1 { font-size: 23px; }
        .head-actions { margin-top: 12px; }
        .hero { grid-template-columns: 1fr; min-height: auto; padding: 18px; }
        .hero-visual { display: none; }
        .toolbar { display: block; }
        .segments { width: 100%; margin-bottom: 9px; }
        .segment { flex: 1; }
        .select { width: 100%; }
        .filters { flex-wrap: nowrap; overflow-x: auto; margin-right: -15px; padding-bottom: 2px; }
        .filter { flex: none; }
        .plugin-grid, .metric-grid, .split, .plan-grid { grid-template-columns: 1fr; }
        .metric-grid { grid-template-columns: repeat(2, 1fr); }
        .table-wrap { overflow-x: auto; }
        .table { min-width: 610px; }
        .guest-strip, .notice { align-items: flex-start; flex-direction: column; }
        .mobile-nav { position: fixed; right: 0; bottom: 0; left: 0; z-index: 12; min-height: 58px; display: flex; justify-content: space-around; padding: 4px 8px; border-top: 1px solid var(--line); background: rgba(20, 27, 30, .96); backdrop-filter: blur(14px); }
        .mobile-item { min-width: 62px; display: grid; gap: 2px; place-items: center; padding: 5px 7px; border: 0; border-radius: 6px; color: var(--faint); background: transparent; font-size: 8px; }
        .mobile-item span { font-size: 15px; }
        .mobile-item.active { color: var(--green); background: #1a3025; }
        .modal { align-items: end; padding: 0; }
        .modal-card, .modal-card.wide { width: 100%; max-height: 92vh; border-right: 0; border-bottom: 0; border-left: 0; border-radius: 10px 10px 0 0; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="#" data-route="discover"><span class="brand-mark">◇</span><span><strong>harndock</strong><small>插件中心</small></span></a>
        <label class="global-search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索插件、开发者或能力" /><span class="key">⌘ K</span></label>
        <span class="top-spacer"></span>

          <nav class="nav-group"><button class="nav-item" data-route="licenses"><span class="nav-icon">◇</span><span>许可证</span><span class="nav-badge">4</span></button><button class="nav-item" data-route="billing"><span class="nav-icon">▤</span><span>订阅与订单</span></button></nav>

        </aside>

    </div>

    <div class="modal" id="auth-modal" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-title"><div class="modal-head"><div><h2 id="auth-title">登录 harndock Account</h2><p id="auth-subtitle">同步购买记录与插件许可证</p></div><button class="icon-button" data-close-modal aria-label="关闭">×</button></div><div class="modal-body" id="auth-body"></div></section></div>
    <div class="modal" id="checkout-modal" hidden><section class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="checkout-title"><div class="modal-head"><div><h2 id="checkout-title">确认购买</h2><p id="checkout-subtitle"></p></div><button class="icon-button" data-close-modal aria-label="关闭">×</button></div><div class="modal-body" id="checkout-body"></div></section></div>
    <div class="modal" id="install-modal" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="install-title"><div class="modal-head"><div><h2 id="install-title">确认本地权限</h2><p id="install-subtitle"></p></div><button class="icon-button" data-close-modal aria-label="关闭">×</button></div><div class="modal-body" id="install-body"></div></section></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const plugins = [
        {id:'research-pro',name:'网页研究 Pro',author:'harndock Labs',icon:'⌁',tone:'',category:'research',tags:['网页抓取','引用整理'],description:'结构化搜索、交叉验证和引用追踪，为复杂研究任务生成可审计报告。',model:'subscription',monthly:29,yearly:278,rating:'4.9',installs:'18.6k',version:'2.4.1',state:'available',license:null,permissions:[['▤','读取项目文件','建立研究上下文'],['◎','访问网络','访问公开网页'],['⌘','执行命令','不需要']]},
        {id:'code-review',name:'代码审查员',author:'harndock Labs',icon:'⌘',tone:'blue',category:'coding',tags:['代码质量','Diff'],description:'按风险分层审查当前变更，定位回归、安全问题和测试缺口。',model:'one_time',price:199,rating:'4.8',installs:'24.2k',version:'3.1.0',state:'update',license:'active',permissions:[['▤','读取项目文件','读取 Git 工作树'],['⌘','执行命令','运行项目检查']]},
        {id:'project-memory',name:'项目记忆库',author:'harndock-community',icon:'◈',tone:'purple',category:'memory',tags:['知识库','本地索引'],description:'维护可搜索的长期项目记忆，让上下文在不同 Session 之间持续。',model:'free',rating:'4.7',installs:'15.3k',version:'1.2.8',state:'installed',license:'active',permissions:[['▤','读取项目文件','建立本地索引'],['⌘','执行命令','运行索引任务']]},
        {id:'workflow-studio',name:'工作流 Studio',author:'Flow Foundry',icon:'↗',tone:'orange',category:'workflow',tags:['自动化','任务流'],description:'将多步操作组合成可复用工作流，并提供条件、审批和失败恢复。',model:'subscription',monthly:49,yearly:470,rating:'4.6',installs:'8.7k',version:'1.8.3',state:'available',license:null,permissions:[['▤','读取项目文件','读取工作流输入'],['⌘','执行命令','执行工作流步骤'],['◎','访问网络','调用已配置服务']]},
        {id:'sql-explorer',name:'SQL 探索器',author:'Data Tools',icon:'◫',tone:'blue',category:'coding',tags:['数据库','查询'],description:'连接开发数据库、解释执行计划，并生成经过确认的安全 SQL 变更。',model:'trial',trialDays:14,monthly:19,yearly:182,rating:'4.5',installs:'6.1k',version:'0.9.6',state:'available',license:null,permissions:[['◎','访问网络','连接配置的数据源'],['▤','读取项目文件','读取 schema 文件']]},
        {id:'meeting-notes',name:'会议整理器',author:'harndock-community',icon:'≡',tone:'purple',category:'memory',tags:['摘要','知识库'],description:'把会议记录整理为决策、行动项和待确认问题，同步到项目记忆。',model:'free',rating:'4.6',installs:'9.8k',version:'1.0.4',state:'installed',license:'active',permissions:[['▤','读取项目文件','读取会议记录']]},
        {id:'issue-triage',name:'Issue 分诊台',author:'Open Source Lab',icon:'!',tone:'orange',category:'workflow',tags:['GitHub','分类'],description:'识别重复 issue，建议优先级、标签和负责模块，并生成回复草稿。',model:'one_time',price:79,rating:'4.4',installs:'5.2k',version:'1.3.1',state:'available',license:'trialing',permissions:[['◎','访问网络','访问代码托管平台']]},
        {id:'image-brief',name:'视觉简报',author:'Canvas Works',icon:'✦',tone:'',category:'research',tags:['图片理解','报告'],description:'从图片和截图中提取结构化信息，为 Session 生成视觉简报。',model:'free',rating:'4.3',installs:'4.9k',version:'0.8.0',state:'disabled',license:'active',permissions:[['▤','读取项目文件','读取图片输入']]}
      ];
      const state = {route:'discover',category:'all',segment:'featured',selected:'research-pro',signedIn:false,authorized:false,pending:null,plan:'yearly',organization:'星河研发',toastTimer:null};
      const content = document.querySelector('#content');
      const detail = document.querySelector('#detail');
      const detailBody = document.querySelector('#detail-body');
      const search = document.querySelector('#search');
      const authModal = document.querySelector('#auth-modal');
      const checkoutModal = document.querySelector('#checkout-modal');
      const installModal = document.querySelector('#install-modal');
      const toast = document.querySelector('#toast');

      const priceLabel = plugin => plugin.model === 'free' ? '免费' : plugin.model === 'one_time' ? `¥${plugin.price}` : plugin.model === 'trial' ? `${plugin.trialDays} 天试用` : `¥${plugin.monthly}/月`;
      const licenseLabel = plugin => plugin.license === 'active' ? '有效' : plugin.license === 'trialing' ? '试用中' : plugin.license === 'organization' ? '组织提供' : '未获取';
      const actionLabel = plugin => plugin.state === 'installed' ? '已安装' : plugin.state === 'disabled' ? '已停用' : plugin.state === 'update' ? '更新' : plugin.license ? '安装' : plugin.model === 'free' ? '获取' : plugin.model === 'trial' ? '开始试用' : '购买';
      const iconClass = plugin => `plugin-icon ${plugin.tone || ''}`;

      function showToast(message) { toast.textContent = message; toast.classList.add('visible'); clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => toast.classList.remove('visible'), 2500); }
      function heading(eyebrow,title,subtitle,actions='') { return `<div class="content-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="head-actions">${actions}</div></div>`; }
      function requireAccount(pending) { if (state.signedIn && state.authorized) return true; state.pending = pending; openAuth(state.signedIn ? 'authorize' : 'login'); return false; }
      function pluginById(id) { return plugins.find(plugin => plugin.id === id); }

      function renderAccount() {
        const wrap = document.querySelector('#account-wrap');
        if (!state.signedIn) { wrap.innerHTML = '<button class="login-button" type="button" id="login-button">登录</button>'; return; }
        wrap.innerHTML = `<button class="account-button" id="account-button"><span class="avatar">LZ</span><span>林舟 · Pro</span><span>⌄</span></button><div class="account-menu" id="account-menu" hidden><div class="account-menu-head"><strong>林舟</strong><span>linzhou@example.com · 个人 Pro</span></div><button class="menu-action" data-route="licenses">许可证与设备</button><button class="menu-action" data-route="billing">订阅与订单</button><button class="menu-action" data-logout>退出登录</button></div>`;
      }

      function renderDiscover() {
        const query = search.value.trim().toLowerCase();
        const list = plugins.filter(plugin => (state.category === 'all' || plugin.category === state.category) && [plugin.name,plugin.author,plugin.description,...plugin.tags].join(' ').toLowerCase().includes(query));
        content.innerHTML = `${heading('Marketplace','发现插件','经过验证的能力，可直接购买并安装到当前 Harness。','<button class="button" data-route="collections">查看合集</button>')}
          ${state.signedIn ? '' : '<div class="guest-strip"><span><strong>登录后可同步许可证</strong>　已购买插件、组织席位和设备激活记录会自动恢复。</span><button class="button" data-auth>登录</button></div>'}
          <section class="hero"><div class="hero-copy"><div class="eyebrow">Editor choice · 2026</div><h2>从检索到引用，交付可追溯的研究结果。</h2><p>网页研究 Pro 现已支持多来源交叉验证、证据分级和团队研究模板。</p><button class="button primary" data-plugin="research-pro">查看插件　→</button></div><div class="hero-visual"><div class="hero-line"><i>1</i><span>检索 18 个来源</span><b>完成</b></div><div class="hero-line"><i>2</i><span>交叉验证关键事实</span><b>进行中</b></div><div class="hero-line"><i>3</i><span>生成引用报告</span><b>待处理</b></div></div></section>
          <div class="toolbar"><div class="segments"><button class="segment ${state.segment==='featured'?'active':''}" data-segment="featured">精选</button><button class="segment ${state.segment==='popular'?'active':''}" data-segment="popular">最受欢迎</button><button class="segment ${state.segment==='new'?'active':''}" data-segment="new">最近更新</button></div><select class="select" aria-label="商业模式"><option>全部价格</option><option>免费</option><option>一次性买断</option><option>订阅</option><option>支持试用</option></select></div>
          <div class="filters"><button class="filter ${state.category==='all'?'active':''}" data-category="all">全部</button><button class="filter ${state.category==='research'?'active':''}" data-category="research">研究与浏览</button><button class="filter ${state.category==='coding'?'active':''}" data-category="coding">开发工具</button><button class="filter ${state.category==='memory'?'active':''}" data-category="memory">记忆与知识</button><button class="filter ${state.category==='workflow'?'active':''}" data-category="workflow">工作流</button></div>
          <div class="section-head"><h2>推荐插件</h2><span>${list.length} 个结果</span></div><div class="plugin-grid">${list.map(pluginCard).join('')}</div>`;
      }

      function pluginCard(plugin) {
        return `<article class="plugin-card ${state.selected===plugin.id?'selected':''}" data-card="${plugin.id}"><div class="plugin-top"><button class="${iconClass(plugin)}" data-plugin="${plugin.id}" aria-label="查看 ${plugin.name}">${plugin.icon}</button><span class="price">${priceLabel(plugin)}<small>${plugin.model==='one_time'?'一次性买断':plugin.model==='subscription'?'可年付':plugin.model==='free'?'社区许可':'无需付款'}</small></span></div><button class="plugin-name" data-plugin="${plugin.id}"><h3>${plugin.name}</h3><span class="author">${plugin.author} · v${plugin.version}</span></button><p>${plugin.description}</p><div class="tag-row">${plugin.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><div class="plugin-foot"><span class="rating"><b>★ ${plugin.rating}</b> · ${plugin.installs} 安装</span><button class="card-action ${plugin.state==='update'?'update':plugin.state==='installed'||plugin.state==='disabled'?'owned':''}" data-action="${plugin.id}">${actionLabel(plugin)}</button></div></article>`;
      }

      function renderDetail() {
        const plugin = pluginById(state.selected);
        const entitlement = plugin.license ? `<strong class="${plugin.license==='trialing'?'warn':'good'}">${licenseLabel(plugin)}</strong>` : '<strong>购买后签发</strong>';
        detailBody.innerHTML = `<div class="detail-title"><div class="${iconClass(plugin)}">${plugin.icon}</div><div><h3>${plugin.name}</h3><p>${plugin.author} · v${plugin.version}</p></div></div><section class="detail-section"><h4>关于</h4><p class="detail-copy">${plugin.description}</p></section><section class="detail-section"><h4>价格与权益</h4><div class="kv"><span>价格</span><strong>${priceLabel(plugin)}</strong></div><div class="kv"><span>许可证</span>${entitlement}</div><div class="kv"><span>设备激活</span><strong>最多 3 台</strong></div><div class="kv"><span>兼容性</span><strong class="good">Harness >= 0.1.0</strong></div></section><section class="detail-section"><h4>运行权限</h4>${plugin.permissions.map(p=>`<div class="permission-row"><div class="permission-icon">${p[0]}</div><div><strong>${p[1]}</strong><span>${p[2]}</span></div><em>${p[2]==='不需要'?'不需要':'安装时确认'}</em></div>`).join('')}</section><div class="detail-actions"><button class="button primary block" data-action="${plugin.id}">${actionLabel(plugin)}</button><button class="button block" data-toast="已打开版本记录和开发者支持信息。">版本与支持</button></div><p class="mini-note">购买由 harndock Account 记录；本地权限由当前 Harness 单独确认。</p>`;
      }

      function renderInstalled(mode='installed') {
        const list = plugins.filter(p => mode === 'updates' ? p.state === 'update' : ['installed','disabled','update'].includes(p.state));
        content.innerHTML = `${heading('Local runtime',mode==='updates'?'可更新':'已安装',mode==='updates'?'检查版本兼容性并在更新失败时保留旧版本。':'管理当前用户范围内的插件、权限和运行状态。',mode==='updates'?'<button class="button primary" data-update-all>全部更新</button>':'<button class="button">＋ 本地导入</button>')}<div class="notice"><span><strong>本地状态正常</strong>　5 个插件已加载，最近一次完整性检查通过。</span><span class="status">● Harness 在线</span></div><section class="data-section"><div class="data-head"><div><h2>${mode==='updates'?'待处理更新':'本地插件'}</h2><p>安装目录：~/Library/Application Support/com.harndock.desktop/harness-home/profiles/desktop</p></div><span class="status muted">用户级</span></div><div class="table-wrap"><table class="table"><thead><tr><th>插件</th><th>版本</th><th>许可证</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(p=>`<tr><td><strong>${p.name}</strong><small>${p.author}</small></td><td>${p.version}${p.state==='update'?'<small>新版本 3.2.0</small>':''}</td><td>${licenseLabel(p)}</td><td><span class="status ${p.state==='disabled'?'muted':p.state==='update'?'warn':''}">${p.state==='disabled'?'已停用':p.state==='update'?'可更新':'运行中'}</span></td><td><button class="row-action" data-plugin="${p.id}">管理</button></td></tr>`).join('')}</tbody></table></div></section><section class="data-section"><div class="data-head"><div><h2>最近安装活动</h2><p>失败更新会自动回滚</p></div></div><div class="activity-list"><div class="activity"><i></i><div><strong>项目记忆库已校验</strong><span>签名和本地文件完整</span></div><time>今天 14:28</time></div><div class="activity"><i></i><div><strong>代码审查员已保留旧版本</strong><span>等待用户确认 v3.2.0 新增权限</span></div><time>昨天</time></div></div></section>`;

        installModal.hidden = false;
        document.querySelector('#install-subtitle').textContent = `${plugin.name} · v${plugin.version}`;
        document.querySelector('#install-body').innerHTML = `<div class="notice"><span><strong>许可证可用</strong>　${licenseLabel(plugin)} · 当前设备激活 1 / 3</span><span class="status">已验证</span></div><div><div class="eyebrow">安装位置</div><p class="detail-copy">当前用户 · ~/Library/Application Support/com.harndock.desktop/harness-home/profiles/desktop/${plugin.id}</p></div><div><div class="eyebrow">运行权限</div><div class="scope-list">${plugin.permissions.map(p=>`<div class="permission-row" style="padding:10px"><div class="permission-icon">${p[0]}</div><div><strong>${p[1]}</strong><span>${p[2]}</span></div><em>${p[2]==='不需要'?'不需要':'必要'}</em></div>`).join('')}</div></div><div><div class="eyebrow">安装前检查</div><p class="detail-copy">✓ 发布者签名有效　 ✓ 包 hash 匹配　 ✓ Harness 版本兼容</p></div><div class="modal-actions"><button class="button" data-close-modal>取消</button><button class="button primary" data-confirm-install="${plugin.id}">确认并安装</button></div><div class="progress" id="install-progress" hidden><div class="progress-label"><span id="progress-text">正在准备…</span><span id="progress-value">0%</span></div><div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div></div>`;
      }

      function handlePluginAction(id) {
        const plugin = pluginById(id); state.selected = id; renderDetail();
        if (plugin.state === 'installed' || plugin.state === 'disabled') { detail.classList.add('mobile-open'); return; }
        if (!requireAccount(`plugin:${id}`)) return;
        if (!plugin.license && plugin.model === 'free') { plugin.license = 'active'; showToast('免费许可证已添加'); openInstall(plugin); return; }
        if (!plugin.license && plugin.model === 'trial') { plugin.license = 'trialing'; showToast(`${plugin.trialDays} 天试用已开始`); openInstall(plugin); return; }
        if (!plugin.license) { openCheckout(plugin); return; }
        openInstall(plugin);
      }

      document.addEventListener('click', event => {
        const route = event.target.closest('[data-route]'); if (route) { event.preventDefault(); state.route=route.dataset.route; render(); return; }
        const plugin = event.target.closest('[data-plugin]'); if (plugin) { state.selected=plugin.dataset.plugin; renderDetail(); document.querySelectorAll('.plugin-card').forEach(card=>card.classList.toggle('selected',card.dataset.card===state.selected)); if (matchMedia('(max-width:1130px)').matches) detail.classList.add('mobile-open'); return; }
        const action = event.target.closest('[data-action]'); if (action) { handlePluginAction(action.dataset.action); return; }
        if (event.target.closest('[data-auth]')) { openAuth(); return; }
        if (event.target.closest('[data-auth-register]')) { openAuth('register'); return; }
        if (event.target.closest('[data-auth-login]')) { openAuth('login'); return; }
        if (event.target.closest('[data-auth-create]')) { state.signedIn=true; openAuth('authorize'); return; }
        const provider = event.target.closest('[data-auth-provider]'); if (provider) { state.signedIn=true; openAuth('authorize'); return; }
        if (event.target.closest('[data-approve-auth]')) { finishAuth(); return; }
        if (event.target.closest('[data-deny-auth]')) { authModal.hidden=true; state.pending=null; showToast('已取消客户端授权'); return; }
        const plan = event.target.closest('[data-plan]'); if (plan) { state.plan=plan.dataset.plan; renderCheckout(pluginById(state.selected)); return; }
        const payment = event.target.closest('[data-confirm-payment]'); if (payment) { const p=pluginById(payment.dataset.confirmPayment); payment.disabled=true; payment.textContent='正在确认支付…'; setTimeout(()=>{p.license='active';renderCheckout(p,'success');renderDetail();},700); return; }
        const nextInstall = event.target.closest('[data-continue-install]'); if (nextInstall) { checkoutModal.hidden=true; openInstall(pluginById(nextInstall.dataset.continueInstall)); return; }
        const install = event.target.closest('[data-confirm-install]'); if (install) { const p=pluginById(install.dataset.confirmInstall); install.hidden=true; const box=document.querySelector('#install-progress'); box.hidden=false; let progress=0; const timer=setInterval(()=>{progress+=20;document.querySelector('#progress-bar').style.width=`${progress}%`;document.querySelector('#progress-value').textContent=`${progress}%`;document.querySelector('#progress-text').textContent=progress<40?'下载签名包…':progress<60?'校验签名与 hash…':progress<80?'写入隔离目录…':progress<100?'注册插件…':'安装完成';if(progress>=100){clearInterval(timer);p.state='installed';setTimeout(()=>{installModal.hidden=true;render();showToast(`${p.name} 已安装到本地 Harness`);},350);}},220); return; }
        const toggle = event.target.closest('[data-toggle]'); if (toggle) { toggle.classList.toggle('on'); showToast('设置已更新'); return; }
        if (event.target.closest('[data-update-all]')) { plugins.filter(p=>p.state==='update').forEach(p=>p.state='installed'); render(); showToast('全部插件已更新'); return; }
        if (event.target.closest('[data-toast]')) { showToast(event.target.closest('[data-toast]').dataset.toast); return; }
        if (event.target.closest('[data-logout]')) { state.signedIn=false;state.authorized=false;render();showToast('已退出市场账号，本地插件保持不变');return; }
        if (event.target.closest('#account-button')) { document.querySelector('#account-menu').hidden=!document.querySelector('#account-menu').hidden; return; }
        if (event.target.closest('#login-button')) { openAuth(); return; }
        if (event.target.closest('[data-close-modal]')) { authModal.hidden=true;checkoutModal.hidden=true;installModal.hidden=true; return; }
      });
      document.querySelector('#close-detail').addEventListener('click',()=>detail.classList.remove('mobile-open'));
      search.addEventListener('input',()=>{if(state.route!=='discover')state.route='discover';renderDiscover();});
      document.addEventListener('click',event=>{const category=event.target.closest('[data-category]');if(category){state.category=category.dataset.category;renderDiscover();}const segment=event.target.closest('[data-segment]');if(segment){state.segment=segment.dataset.segment;renderDiscover();}});
      document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();search.focus();}if(event.key==='Escape'){authModal.hidden=true;checkoutModal.hidden=true;installModal.hidden=true;detail.classList.remove('mobile-open');}});
      render();
    </script>
  </body>
</html>
