    <style>

ding:13px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.metric span{display:block;margin-bottom:10px;color:var(--faint);font-size:9px}.metric b{display:block;font-size:19px;letter-spacing:-.03em}.metric small{color:var(--green);font-size:8px}.data{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.data-head{min-height:49px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}.data-head h2{margin:0;font-size:12px}.data-head p{margin:3px 0 0;color:var(--faint);font-size:8px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th{padding:9px 12px;color:var(--faint);font-size:8px;font-weight:550;text-align:left;white-space:nowrap}.table td{padding:11px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;vertical-align:middle}.table td strong{display:block;color:var(--ink);font-size:10px;font-weight:550}.table td small{display:block;margin-top:2px;color:var(--faint);font-size:8px}.row{padding:0;border:0;color:var(--blue);background:transparent;font-size:9px}.row:hover{text-decoration:underline}.two{display:grid;grid-template-columns:1.12fr .88fr;gap:12px}.settings{padding:0 14px}.setting{min-height:57px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting strong{display:block;font-size:10px;font-weight:550}.setting span{display:block;margin-top:3px;color:var(--faint);font-size:8px}.toggle{width:34px;height:19px;padding:2px;border:0;border-radius:999px;background:#2b3734}.toggle:before{display:block;width:15px;height:15px;border-radius:50%;background:var(--faint);content:""}.toggle.on{background:#35694e}.toggle.on:before{background:var(--green);transform:translateX(15px)}.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:rgba(5,8,9,.75)}.modal-card{width:min(540px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.4)}.modal-head{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:15px}.modal-head p{margin:4px 0 0;color:var(--faint);font-size:9px}.modal-body{display:grid;gap:14px;padding:19px 20px 20px}.install-card{padding:12px;border:1px solid #3e6952;border-radius:7px;background:#18271f}.install-card strong{display:block;font-size:11px}.install-card span{display:block;margin-top:4px;color:var(--muted);font-size:9px}.modal-actions{display:flex;justify-content:flex-end;gap:7px}.mobile-nav{display:none}@media(max-width:850px){.workspace{grid-template-columns:190px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:600px){.app{grid-template-rows:57px minmax(0,1fr)}.top{padding:0 13px}.brand{min-width:auto}.brand strong,.brand small,.user{display:none}.tenant{margin-left:auto}.workspace{display:block}.side{display:none}.main{min-height:calc(100vh - 57px);padding:20px 15px 75px}.head{display:block}.actions{margin-top:12px}.notice{align-items:flex-start;flex-direction:column}.metrics{gap:6px}.metric{padding:11px}.metric b{font-size:17px}.mobile-nav{position:fixed;right:0;bottom:0;left:0;z-index:9;display:flex;justify-content:space-around;min-height:57px;padding:4px 9px;border-top:1px solid var(--line);background:rgba(20,27,30,.96)}.mobile-nav button{min-width:63px;border:0;border-radius:6px;color:var(--faint);background:transparent;font-size:8px}.mobile-nav button.active{color:var(--green);background:#1a3025}.mobile-nav span{display:block;font-size:15px}.table{min-width:600px}.modal{align-items:end;padding:0}.modal-card{width:100%;max-height:92vh;border-bottom:0;border-radius:9px 9px 0 0}}

  <body>
    <div class="app"><header class="top"><div class="brand"><span class="mark">◇</span><span><strong>harndock Gateway</strong><small>插件治理控制台</small></span></div><span class="top-spacer"></span><div class="tenant"><span class="avatar">星</span><span><b>星河研发</b>　组织管理员</span></div><span class="user">林舟　⌄</span></header><div class="workspace"><aside class="side"><div class="label">组织</div><nav class="nav"><button data-tab="overview" class="active"><i>⌂</i><span>概览</span></button><button data-tab="catalog"><i>◇</i><span>插件目录</span><span class="badge">32</span></button><button data-tab="tasks"><i>↻</i><span>安装任务</span><span class="badge warn">3</span></button></nav><div class="label">治理</div><nav class="nav"><button data-tab="members"><i>◎</i><span>成员与席位</span></button><button data-tab="policy"><i>⌘</i><span>插件策略</span></button><button data-tab="sources"><i>▤</i><span>插件源</span></button><button data-tab="audit"><i>≡</i><span>审计日志</span></button></nav><div class="side-card"><strong>Gateway 正常</strong><span>3 台 Desktop 在线 · 延迟 42ms</span><span>策略同步于 2 分钟前</span></div></aside><main class="main" id="main"></main></div><nav class="mobile-nav"><button data-tab="overview" class="active"><span>⌂</span>概览</button><button data-tab="catalog"><span>◇</span>目录</button><button data-tab="tasks"><span>↻</span>任务</button><button data-tab="policy"><span>⌘</span>策略</button></nav></div>
    <div class="modal" id="task-modal" hidden><section class="modal-card"><div class="modal-head"><div><h2>安装到组织设备</h2><p>创建受策略约束的远程安装任务</p></div><button class="btn" data-close>×</button></div><div class="modal-body"><div class="install-card"><strong>网页研究 Pro · v2.4.1</strong><span>harndock Labs · 已审核 · 许可证可用</span></div><label class="field">目标设备<select class="select"><option>林舟的 MacBook Pro · 在线</option><option>研发 Mac mini · 在线</option><option>设计工作站 · 离线</option></select></label><p style="margin:0;color:var(--muted);font-size:10px;line-height:1.6">任务会发送到 Desktop。成员仍需在本地确认文件、网络和命令执行权限。Gateway 不会直接写入设备文件。</p><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="create-task">创建安装任务</button></div></div></section></div><div class="toast" id="toast" hidden></div>
    <script>
      const main=document.querySelector('#main'), modal=document.querySelector('#task-modal'), toast=document.querySelector('#toast'); let active='overview';
      const head=(ey,title,sub,actions='')=>`<div class="head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
      const table=(rows)=>`<div class="table-wrap"><table class="table"><thead><tr><th>插件</th><th>版本</th><th>许可证</th><th>设备/成员</th><th>状态</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
      function overview(){main.innerHTML=`${head('Organization control plane','插件治理概览','管理星河研发的插件来源、策略和安装任务。','<button class="btn primary" data-tab="catalog">浏览插件目录</button>')}<div class="notice"><span><strong>策略运行正常</strong>　组织策略已应用到 3 台在线 Desktop，最近一次同步 2 分钟前。</span><span class="status">● 保护中</span></div><div class="metrics"><div class="metric"><span>在线设备</span><b>3 / 5</b><small>2 台待连接</small></div><div class="metric"><span>已购插件</span><b>8</b><small>20 个组织席位</small></div><div class="metric"><span>安装任务</span><b>3</b><small>1 个待确认</small></div><div class="metric"><span>本月账单</span><b>¥1,176</b><small>下月 1 日续费</small></div></div><section class="data"><div class="data-head"><div><h2>需要关注</h2><p>安装、许可证和安全状态</p></div><button class="row" data-tab="tasks">查看全部</button></div>${table('<tr><td><strong>网页研究 Pro</strong><small>新增权限：访问网络</small></td><td>v2.4.1</td><td>8 / 8 席位</td><td>1 台设备</td><td><span class="status warn">待成员确认</span></td><td><button class="row" data-tab="tasks">处理</button></td></tr><tr><td><strong>代码审查员</strong><small>版本可更新</small></td><td>v3.1.0 → 3.2.0</td><td>6 / 8 席位</td><td>4 台设备</td><td><span class="status">策略允许</span></td><td><button class="row" data-tab="catalog">查看</button></td></tr>')}</section><div class="two"><section class="data"><div class="data-head"><div><h2>策略摘要</h2><p>组织默认规则</p></div><button class="row" data-tab="policy">编辑</button></div><div class="settings"><div class="setting"><div><strong>仅允许已审核插件</strong><span>阻止未知来源包</span></div><span class="status">开启</span></div><div class="setting"><div><strong>高风险权限需批准</strong><span>命令执行、全盘文件</span></div><span class="status">开启</span></div><div class="setting"><div><strong>自动更新安全修复</strong><span>同一主版本内</span></div><span class="status muted">关闭</span></div></div></section><section class="data"><div class="data-head"><div><h2>最近活动</h2><p>Gateway 审计事件</p></div></div><div class="settings"><div class="setting"><div><strong>成员 林舟 请求安装</strong><span>网页研究 Pro · MacBook Pro</span></div><small style="color:var(--faint)">2 分钟前</small></div><div class="setting"><div><strong>策略阻止未知插件</strong><span>来源：本地开发目录</span></div><small style="color:var(--faint)">昨天</small></div></div></section></div>`}
      function catalog(){main.innerHTML=`${head('Organization catalog','插件目录','浏览官方市场和组织私有源，购买与安装策略在此统一。','<button class="btn">＋ 添加私有源</button>')}<div class="notice"><span><strong>Marketplace 已连接</strong>　价格和许可证由市场服务管理，Gateway 仅同步组织权益。</span><span class="status">● 官方源</span></div><section class="data"><div class="data-head"><div><h2>组织可用插件</h2><p>8 个已购插件 · 4 个可申请</p></div><select class="select"><option>全部来源</option><option>官方市场</option><option>星河私有源</option></select></div>${table('<tr><td><strong>网页研究 Pro</strong><small>harndock Labs · 研究与浏览</small></td><td>v2.4.1</td><td>8 个席位</td><td>组织成员</td><td><span class="status">可安装</span></td><td><button class="btn primary" data-install>安装</button></td></tr><tr><td><strong>代码审查员</strong><small>harndock Labs · 开发工具</small></td><td>v3.2.0</td><td>8 个席位</td><td>6 个成员</td><td><span class="status warn">可更新</span></td><td><button class="btn" data-install>更新</button></td></tr><tr><td><strong>项目记忆库</strong><small>harndock-community · 免费</small></td><td>v1.2.8</td><td>不限</td><td>12 个成员</td><td><span class="status">允许</span></td><td><button class="btn" data-install>管理</button></td></tr>')}</section>`}
      function tasks(){main.innerHTML=`${head('Install orchestration','安装任务','跟踪 Gateway 发往各台 Desktop 的安装和更新状态。','<button class="btn primary" data-tab="catalog">创建任务</button>')}<section class="data"><div class="data-head"><div><h2>进行中的任务</h2><p>任务只携带已签名的安装意图，不包含项目文件</p></div><span class="status warn">3 个任务</span></div>${table('<tr><td><strong>网页研究 Pro</strong><small>v2.4.1 · 林舟发起</small></td><td>现在</td><td>1 个设备</td><td>林舟的 MacBook Pro</td><td><span class="status warn">等待本地确认</span></td><td><button class="row">查看</button></td></tr><tr><td><strong>代码审查员</strong><small>v3.2.0 · 系统更新</small></td><td>今天 09:20</td><td>4 个设备</td><td>3 在线 · 1 离线</td><td><span class="status">3 / 4 完成</span></td><td><button class="row">查看</button></td></tr><tr><td><strong>项目记忆库</strong><small>v1.2.8 · 新成员批量安装</small></td><td>昨天</td><td>7 个设备</td><td>全部完成</td><td><span class="status">已完成</span></td><td><button class="row">日志</button></td></tr>')}</section></section>`}
      function members(){simple('Members & seats','成员与席位','查看成员分配的插件席位和最后在线设备。','<button class="btn primary">邀请成员</button>',`<section class="data"><div class="data-head"><div><h2>成员</h2><p>12 位成员 · 2 位管理员</p></div><button class="row">批量分配</button></div>${table('<tr><td><strong>林舟</strong><small>linzhou@example.com · 管理员</small></td><td>3 个插件</td><td>MacBook Pro</td><td>刚刚在线</td><td><span class="status">正常</span></td><td><button class="row">管理</button></td></tr><tr><td><strong>顾言</strong><small>guyan@example.com · 成员</small></td><td>2 个插件</td><td>Mac mini</td><td>5 分钟前</td><td><span class="status">正常</span></td><td><button class="row">管理</button></td></tr><tr><td><strong>周宁</strong><small>zhouning@example.com · 成员</small></td><td>1 个插件</td><td>未连接</td><td>2 天前</td><td><span class="status muted">离线</span></td><td><button class="row">管理</button></td></tr>')}</section>`)}
      function policy(){simple('Policy enforcement','插件策略','决定哪些插件可以进入组织设备，以及哪些权限需要人工批准。','<button class="btn primary" data-save-policy>保存策略</button>',`<section class="data"><div class="data-head"><div><h2>安装与权限</h2><p>策略变更会记录到审计日志</p></div><span class="status">已同步</span></div><div class="settings"><div class="setting"><div><strong>仅允许已审核插件</strong><span>未通过市场审核的版本无法创建安装任务</span></div><button class="toggle on" data-toggle></button></div><div class="setting"><div><strong>阻止本地未知来源</strong><span>禁止成员从 zip 或开发目录直接安装</span></div><button class="toggle on" data-toggle></button></div><div class="setting"><div><strong>高风险权限需管理员批准</strong><span>命令执行、网络访问和全盘文件访问</span></div><button class="toggle on" data-toggle></button></div><div class="setting"><div><strong>自动更新安全修复</strong><span>仅同一主版本，失败时回滚</span></div><button class="toggle" data-toggle></button></div></div></section><section class="data"><div class="data-head"><div><h2>允许列表</h2><p>成员只能安装以下插件</p></div><button class="row">编辑列表</button></div><div class="settings"><div class="setting"><div><strong>harndock Marketplace</strong><span>官方签名源</span></div><span class="status">允许</span></div><div class="setting"><div><strong>星河研发私有源</strong><span>registry.xinghe.dev · mTLS</span></div><span class="status">允许</span></div></div></section>`)}
      function sources(){simple('Plugin sources','插件源','管理官方市场、企业私有源和离线镜像。','<button class="btn primary">＋ 添加源</button>',`<section class="data"><div class="data-head"><div><h2>已配置来源</h2><p>来源包必须经过签名校验</p></div></div>${table('<tr><td><strong>harndock Marketplace</strong><small>官方市场 · https://market.deepseek.com</small></td><td>32 个插件</td><td>同步 2 分钟前</td><td><span class="status">签名有效</span></td><td><button class="row">配置</button></td></tr><tr><td><strong>星河研发私有源</strong><small>registry.xinghe.dev · 企业源</small></td><td>6 个插件</td><td>同步 1 小时前</td><td><span class="status">mTLS 有效</span></td><td><button class="row">配置</button></td></tr><tr><td><strong>本地开发目录</strong><small>仅开发模式</small></td><td>—</td><td>已禁用</td><td><span class="status muted">不允许</span></td><td><button class="row">查看</button></td></tr>')}</section>`)}
      function audit(){simple('Audit trail','审计日志','记录策略、许可证和安装任务，不记录项目内容或插件输入输出。','<button class="btn">导出日志</button>',`<section class="data"><div class="data-head"><div><h2>最近事件</h2><p>保留 90 天 · 可导出 CSV</p></div><select class="select"><option>全部事件</option><option>安装</option><option>策略</option><option>许可证</option></select></div>${table('<tr><td><strong>install.requested</strong><small>网页研究 Pro · 林舟的 MacBook</small></td><td>林舟</td><td>2026-08-30 14:32</td><td><span class="status warn">等待确认</span></td><td>仅元数据</td></tr><tr><td><strong>policy.updated</strong><small>开启高风险权限审批</small></td><td>林舟</td><td>2026-08-30 11:04</td><td><span class="status">成功</span></td><td>仅元数据</td></tr><tr><td><strong>license.activated</strong><small>代码审查员 · Mac mini</small></td><td>Marketplace</td><td>2026-08-29 18:41</td><td><span class="status">成功</span></td><td>仅元数据</td></tr>')}</section>`)}
      function simple(ey,title,sub,actions,body){main.innerHTML=head(ey,title,sub,actions)+body}
      function render(){document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===active));({overview,catalog,tasks,members,policy,sources,audit}[active]||overview)();}
      document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){active=tab.dataset.tab;render();return}if(e.target.closest('[data-install]')){modal.hidden=false;return}if(e.target.closest('[data-close]')){modal.hidden=true;return}if(e.target.closest('#create-task')){modal.hidden=true;toast.textContent='安装任务已创建，已发送到目标 Desktop。';toast.hidden=false;setTimeout(()=>toast.hidden=true,2500);active='tasks';render();return}if(e.target.closest('[data-toggle]')){e.target.closest('[data-toggle]').classList.toggle('on');return}if(e.target.closest('[data-save-policy]')){toast.textContent='组织策略已保存并同步到在线设备。';toast.hidden=false;setTimeout(()=>toast.hidden=true,2500)}});
      render();
    </script>
  </body>
</html>
